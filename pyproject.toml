[project]
name = "chatbox"
version = "0.1.0"
description = "Exchange messages between users."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.26",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "crispy-bootstrap5==2026.3",
    "daphne==4.2.3",
    "dj-database-url==3.1.2",
    "django==6.1",
    "django-crispy-forms==2.7",
    "django-storages>=1.14.6",
    "pillow==12.3.0",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "pydotplus>=2.0.2",
]
